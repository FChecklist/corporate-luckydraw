# CI for Corporate Lucky Draw. Two jobs, named exactly so: `typecheck` and `each-file`.
# Nothing here deploys. Deploys are made by hand by BOSS after two independent audits say PASS.
name: ci
on:
  pull_request:
  push:
    branches: [feat/luckydraw-on-engine-2026-10-31, main]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
  each-file:
    # every test file is its own process (tools/run-each-file.mjs), so one slow file can never time out another
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: node tools/run-each-file.mjs --jobs 4
